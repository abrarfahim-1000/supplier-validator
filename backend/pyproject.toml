[project]
name = "supplier-document-checker"
version = "0.1.0"
description = "Deterministic supplier quote checker (BIAI AI Engineer Round 2, Task 1)"
readme = { text = "Backend for the supplier document checker. See ../README.md.", content-type = "text/markdown" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "pdfplumber>=0.11,<1",
    "pypdf>=5.0,<7",
    "langgraph>=0.2,<2",
    "openai>=1.50,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "httpx>=0.27,<1",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checker", "src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -p no:langsmith"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["checker", "api"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "evals"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
